<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">Bridge</h1>
      <p class="subtitle">Transfer playlists between Spotify and YouTube</p>
    </header>

    <section class="auth-section">
      <div class="auth-row">
        <span class="auth-label">Spotify</span>
        <button type="button" id="spotify-login" class="btn btn-primary">Log in</button>
        <button type="button" id="spotify-logout" class="btn btn-ghost hidden">Log out</button>
        <span id="spotify-status" class="status"></span>
      </div>
      <div class="auth-row">
        <span class="auth-label">YouTube</span>
        <button type="button" id="youtube-login" class="btn btn-primary">Log in</button>
        <button type="button" id="youtube-logout" class="btn btn-ghost hidden">Log out</button>
        <span id="youtube-status" class="status"></span>
      </div>
    </section>

    <section class="playlists-section">
      <div class="playlist-group">
        <label class="label" for="source-platform">Source</label>
        <select id="source-platform" class="select select-platform">
          <option value="">Select platform</option>
          <option value="spotify">Spotify</option>
          <option value="youtube">YouTube</option>
        </select>
      </div>
      <div class="playlist-group">
        <label class="label" for="source-playlist">Source playlist(s) <span class="hint">(Ctrl+click to select multiple)</span></label>
        <select id="source-playlist" class="select select-multi" multiple disabled>
          <option value="">Select source</option>
        </select>
        <span id="source-empty-msg" class="empty-msg hidden">No playlists found</span>
      </div>
      <div class="playlist-group">
        <label class="label" for="dest-platform">Destination</label>
        <select id="dest-platform" class="select select-platform">
          <option value="">Select platform</option>
          <option value="spotify">Spotify</option>
          <option value="youtube">YouTube</option>
        </select>
        <span class="hint">A new playlist with the same name will be created on the destination.</span>
      </div>
      <div id="validation-msg" class="validation-msg hidden"></div>
    </section>

    <section class="transfer-section">
      <button type="button" id="transfer-btn" class="btn btn-accent btn-block" disabled>Transfer</button>
      <div id="progress-wrap" class="progress-wrap hidden">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-text" class="progress-text">0 / 0</p>
      </div>
      <div id="message" class="message hidden"></div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="spotify.js"></script>
  <script src="youtube.js"></script>
  <script src="popup.js"></script>
</body>
</html>
