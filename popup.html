<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">Bridge</h1>
      <p class="subtitle">Transfer playlists between Spotify and YouTube</p>
    </header>

    <section class="auth-section">
      <div class="auth-row">
        <span class="auth-label">Spotify</span>
        <button type="button" id="spotify-login" class="btn btn-primary">Log in</button>
        <button type="button" id="spotify-logout" class="btn btn-ghost hidden">Log out</button>
        <span id="spotify-status" class="status"></span>
      </div>
      <div class="auth-row">
        <span class="auth-label">YouTube</span>
        <button type="button" id="youtube-login" class="btn btn-primary">Log in</button>
        <button type="button" id="youtube-logout" class="btn btn-ghost hidden">Log out</button>
        <span id="youtube-status" class="status"></span>
      </div>
    </section>

    <section class="playlists-section">
      <div class="direction-selector">
        <button type="button" id="dir-spotify-youtube" class="btn dir-btn active">Spotify → YouTube</button>
        <button type="button" id="dir-youtube-spotify" class="btn dir-btn">YouTube → Spotify</button>
      </div>
      <div class="playlist-group">
        <label class="label" for="source-playlist">Source playlist</label>
        <select id="source-playlist" class="select" disabled>
          <option value="">Select source</option>
        </select>
        <span id="source-platform" class="platform-tag"></span>
      </div>
      <div class="playlist-group">
        <label class="label" for="dest-playlist">Destination playlist</label>
        <select id="dest-playlist" class="select" disabled>
          <option value="">Select destination</option>
        </select>
        <span id="dest-platform" class="platform-tag"></span>
      </div>
    </section>

    <section class="transfer-section">
      <div class="transfer-buttons">
        <button type="button" id="transfer-spotify-to-youtube" class="btn btn-accent" disabled>
          Transfer to YouTube
        </button>
        <button type="button" id="transfer-youtube-to-spotify" class="btn btn-accent" disabled>
          Transfer to Spotify
        </button>
      </div>
      <div id="progress-wrap" class="progress-wrap hidden">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-text" class="progress-text">0 / 0</p>
      </div>
      <div id="message" class="message hidden"></div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="spotify.js"></script>
  <script src="youtube.js"></script>
  <script src="popup.js"></script>
</body>
</html>
